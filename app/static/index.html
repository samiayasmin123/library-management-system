<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Library Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>AI Library Assistant</h1>

    <hr>

    <!-- ================================= -->
    <!-- LOGIN SECTION -->
    <!-- ================================= -->

    <div id="login-section">

        <h3>Login</h3>

        <label>Email</label><br>
        <input type="email" id="login-email" placeholder="you@example.com"><br><br>

        <label>Password</label><br>
        <input type="password" id="login-password" placeholder="Password"><br><br>

        <button onclick="login()">Login</button>

        <p id="login-error" style="color:red;"></p>

    </div>

    <!-- ================================= -->
    <!-- CHAT SECTION (hidden until login) -->
    <!-- ================================= -->

    <div id="chat-section" style="display:none;">

        <button onclick="logout()" style="float:right;">Logout</button>

        <label>Message</label><br>
        <input
            type="text"
            id="message"
            placeholder="Type your message..."
            style="width:400px;"
        >

        <button onclick="sendMessage()">
            Send
        </button>

        <hr>

        <h3>Response</h3>

        <pre id="response">
No response yet...
        </pre>

    </div>

    <script src="/static/index.js"></script>

</body>
</html>
